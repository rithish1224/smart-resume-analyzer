services:
  - type: web
    name: skillora-api
    runtime: python
    plan: starter
    rootDir: .
    buildCommand: pip install -r requirements.txt && python -m spacy download en_core_web_sm
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: FRONTEND_URL
        value: https://frontend-theta-gules-m76exubm0l.vercel.app
      - key: ALLOWED_ORIGINS
        value: '["https://frontend-theta-gules-m76exubm0l.vercel.app"]'
      - key: DATABASE_URL
        value: sqlite+aiosqlite:///./scd.db
